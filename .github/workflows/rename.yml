name: Rename to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename dental-clinic.html to index.html
        run: |
          git config user.name "mariamumtaz318-design"
          git config user.email "mariamumtaz318-design@users.noreply.github.com"
          git mv dental-clinic.html index.html
          git commit -m "Rename dental-clinic.html to index.html"
          git push
